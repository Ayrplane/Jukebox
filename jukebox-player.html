<!doctype html>
<!--
  Jukebox YouTube wrapper page.

  YouTube refuses embeds that arrive with no HTTP Referer (Error 153). The
  game's WebPanel loads URLs directly, so it can't send one. Hosting this page
  on any https site (e.g. GitHub Pages) fixes that: the YouTube iframe inside
  it gets this page's site as its referrer.

  Uses the privacy-enhanced youtube-nocookie.com player, which skips the
  cookie-consent screen. When playback actually begins it seeks forward by
  however long loading took, so every client lands on the host's position.

  Usage:  https://<your-site>/jukebox-player.html?v=<videoId>&start=<seconds>
  Then set JukeboxHud's "Player Page Url" to https://<your-site>/jukebox-player.html
-->
<html>
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Jukebox Player</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #player { width: 100%; height: 100%; }
    /* Transparent layer over the video. The game "clicks" here when a song
       starts: browsers only allow sound after a click on the page, and a
       click here always means play (never pause), so repeats are safe. */
    #tap { position: fixed; inset: 0; z-index: 10; cursor: pointer; }
  </style>
</head>
<body>
  <div id="player"></div>
  <div id="tap"></div>
  <script>
    var params = new URLSearchParams(location.search);
    var videoId = (params.get('v') || '').replace(/[^A-Za-z0-9_-]/g, '');
    var start = parseFloat(params.get('start') || '0') || 0;
    var loadedAt = Date.now();   // the game builds this URL right as it loads it

    var tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);

    var player = null;

    function tryPlay() {
      if (!player || !player.playVideo) return;
      player.unMute();
      player.setVolume(100);
      player.playVideo();
    }

    // Where the host's song is right now (its clock kept running while we
    // loaded, buffered or sat through an ad).
    function hostPosition() { return start + (Date.now() - loadedAt) / 1000; }

    // Every 2s while the song plays, snap back if we're >2s off the host.
    // Catches up after an ad or a slow load, and corrects gradual drift.
    // (YouTube doesn't allow seeking during an ad, so this only takes
    // effect once the song itself is playing.)
    setInterval(function () {
      if (!player || !player.getPlayerState) return;
      if (player.getPlayerState() !== YT.PlayerState.PLAYING) return;
      var target = hostPosition();
      if (Math.abs(player.getCurrentTime() - target) > 2) player.seekTo(target, true);
    }, 2000);

    document.getElementById('tap').addEventListener('mousedown', tryPlay);
    document.getElementById('tap').addEventListener('click', tryPlay);

    function onYouTubeIframeAPIReady() {
      if (!videoId) return;
      player = new YT.Player('player', {
        host: 'https://www.youtube-nocookie.com',
        videoId: videoId,
        playerVars: { autoplay: 1, start: Math.floor(start), controls: 0, rel: 0,
                      playsinline: 1, iv_load_policy: 3, origin: location.origin },
        events: {
          onReady: function () { tryPlay(); }
        }
      });
    }
  </script>
</body>
</html>
